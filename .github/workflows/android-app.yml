name: Build Android app

# Builds android-app/ into duty-board.apk and publishes it on the "android-app" release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: bash android-app/build.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-app >/dev/null 2>&1 || gh release create android-app --title "Duty Board Android app" --notes "The Duty Board as an Android app. It opens the same live Duty Board and adds alerts that fire with the phone locked. Download duty-board.apk below and open it to install."
          gh release upload android-app android-app/duty-board.apk --clobber
